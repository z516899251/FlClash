# 八戒订阅用量定制版 Windows 打包流程，仅用于在 GitHub Actions 云端生成安装包。
name: Windows Bajie Build

on:
  # 推送到定制分支时自动打包，方便每次源码调整后直接拿到新产物。
  push:
    branches:
      - codex/bajie-subscription-usage
  # 允许在 GitHub Actions 页面手动点击运行，并可选择要打包的分支。
  workflow_dispatch:

env:
  # 使用稳定环境参数，保持与正式版 Windows 包的运行配置一致。
  IS_STABLE: "true"

jobs:
  windows:
    # Windows x64 打包任务，输出由 setup.dart 写入 dist 目录。
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      # 拉取源码和子模块，core 与构建插件都依赖 submodules。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Windows 构建路径较长，开启 longpaths 避免依赖路径超限。
      - name: Enable git long paths
        run: git config --global core.longpaths true

      # 安装 Go，用于 setup.dart 预编译 ClashMeta core。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache-dependency-path: |
            core/go.sum

      # 安装项目当前上游工作流使用的 Flutter 版本。
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      # 拉取 Dart/Flutter 依赖，提前暴露 pub 解析问题。
      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      # 运行 Flutter 静态分析，并把完整输出写入 artifact，便于排查 Dart 编译问题。
      - name: Analyze Flutter sources
        continue-on-error: true
        shell: pwsh
        run: |
          # 日志目录提前创建，后续失败时仍可上传分析结果。
          $distPath = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force -Path $distPath | Out-Null
          $analyzeLogPath = Join-Path $distPath "flutter-analyze.log"
          flutter analyze --no-fatal-infos *>&1 | Tee-Object -FilePath $analyzeLogPath
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # 执行 Windows 打包脚本，生成 exe 和 zip 到 dist 目录。
      - name: Package Windows
        continue-on-error: true
        shell: pwsh
        run: |
          # 发行脚本日志写入 artifact，避免只能看到中间目录而看不到失败原因。
          $distPath = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force -Path $distPath | Out-Null
          $packageLogPath = Join-Path $distPath "setup-windows.log"
          dart setup.dart windows --env stable -v *>&1 | Tee-Object -FilePath $packageLogPath
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # 发行脚本没有留下 Release 目录时，显式执行 Flutter Windows 构建作为兜底。
      - name: Build Windows portable fallback
        # 兜底构建失败时继续执行产物收集，避免发行脚本已有产物却被 fallback 中断。
        continue-on-error: true
        shell: pwsh
        run: |
          # Flutter Release 输出目录，里面的 FlClash.exe 可直接运行。
          $distPath = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force -Path $distPath | Out-Null
          $releasePath = Join-Path $PWD "build/windows/x64/runner/Release"
          $appExePath = Join-Path $releasePath "FlClash.exe"
          if (-not (Test-Path $appExePath)) {
            $fallbackLogPath = Join-Path $distPath "flutter-build-windows.log"
            flutter build windows --release --dart-define-from-file=env.json -v *>&1 |
              Tee-Object -FilePath $fallbackLogPath
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      # 汇总 Windows 产物；如果发行脚本没有写入 dist，则兜底打包 Flutter Release 目录。
      - name: Collect Windows outputs
        if: always()
        shell: pwsh
        run: |
          # 产物目录固定为仓库根目录下的 dist，便于 upload-artifact 统一读取。
          $distPath = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force -Path $distPath | Out-Null

          # Flutter Windows Release 输出目录，包含可直接运行的 FlClash.exe 及依赖文件。
          $releasePath = Join-Path $PWD "build/windows/x64/runner/Release"
          $appExePath = Join-Path $releasePath "FlClash.exe"
          if (Test-Path $appExePath) {
            $portableZipPath = Join-Path $distPath "FlClash-Bajie-Windows-x64-portable.zip"
            Compress-Archive -Path (Join-Path $releasePath "*") -DestinationPath $portableZipPath -Force
          }

          # 自动扫描 Flutter Windows bundle 目录，兼容不同 Flutter 版本或打包器生成的实际路径。
          $windowsBuildPath = Join-Path $PWD "build/windows"
          if (Test-Path $windowsBuildPath) {
            $bundleDirs = Get-ChildItem -Path $windowsBuildPath -Directory -Recurse |
              Where-Object {
                $hasExecutable = @(Get-ChildItem -Path $_.FullName -Filter "*.exe" -File -ErrorAction SilentlyContinue).Count -gt 0
                $hasFlutterDll = Test-Path (Join-Path $_.FullName "flutter_windows.dll")
                $hasFlutterAssets = Test-Path (Join-Path $_.FullName "data/flutter_assets")
                $hasExecutable -and ($hasFlutterDll -or $hasFlutterAssets)
              } |
              Sort-Object FullName -Unique

            $index = 1
            foreach ($bundleDir in $bundleDirs) {
              $portableZipPath = Join-Path $distPath "FlClash-Bajie-Windows-x64-portable-$index.zip"
              Compress-Archive -Path (Join-Path $bundleDir.FullName "*") -DestinationPath $portableZipPath -Force
              $index++
            }
          }

          # 兜底上传完整 Windows 构建树，便于在路径识别失败时仍能下载并定位真实可执行文件。
          if (Test-Path $windowsBuildPath) {
            $buildTreeZipPath = Join-Path $distPath "FlClash-Bajie-Windows-build-tree.zip"
            Compress-Archive -Path (Join-Path $windowsBuildPath "*") -DestinationPath $buildTreeZipPath -Force
          }

          # 诊断文件记录仓库内生成的 Windows 相关文件，便于后续排查产物路径。
          $diagnosticPath = Join-Path $distPath "artifact-diagnostics.txt"
          Get-ChildItem -Path $PWD -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\(dist|build)\\"
            } |
            Select-Object FullName, Length |
            Format-Table -AutoSize |
            Out-String |
            Set-Content -Path $diagnosticPath

          # 只把真正的安装包/便携包视为有效产物，构建树和日志只用于诊断。
          $validArtifactFiles = Get-ChildItem -Path $distPath -Recurse -File |
            Where-Object {
              $_.Name -notin @(
                "artifact-diagnostics.txt",
                "flutter-analyze.log",
                "setup-windows.log",
                "flutter-build-windows.log",
                "FlClash-Bajie-Windows-build-tree.zip",
                "NO_DOWNLOADABLE_ARTIFACT.txt"
              ) -and $_.Extension -in @(".zip", ".exe", ".msi", ".msix")
            }
          if (-not $validArtifactFiles) {
            $missingMarkerPath = Join-Path $distPath "NO_DOWNLOADABLE_ARTIFACT.txt"
            "No downloadable Windows artifact was found. Check artifact-diagnostics.txt." |
              Set-Content -Path $missingMarkerPath
            Write-Warning "No downloadable Windows artifact was found. Diagnostics will be uploaded."
            return
          }
          $validArtifactFiles | Select-Object FullName, Length | Format-Table -AutoSize

      # 上传 dist 目录，安装包可在 Actions 运行详情页下载。
      - name: Upload Windows artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Bajie-Windows-x64
          path: ./dist
          if-no-files-found: error
          overwrite: true

      # 上传诊断后再校验是否真的包含可运行产物，避免成功状态掩盖空包问题。
      - name: Validate Windows artifact
        if: always()
        shell: pwsh
        run: |
          # 只要缺失标记存在，就说明上传的是诊断文件而不是可运行客户端。
          $missingMarkerPath = Join-Path $PWD "dist/NO_DOWNLOADABLE_ARTIFACT.txt"
          if (Test-Path $missingMarkerPath) {
            throw "No downloadable Windows artifact was produced."
          }
